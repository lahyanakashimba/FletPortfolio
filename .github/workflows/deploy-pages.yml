name: Deploy Flet Portfolio to GitHub Pages

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt

      - name: Build Flet web app
        env:
          PYTHONUTF8: "1"
          PYTHONIOENCODING: utf-8
          FLET_CLI_NO_RICH_OUTPUT: "1"
        run: flet build web --yes --no-rich-output --base-url /FletPortfolio/

      - name: Verify build output
        run: |
          ls -la
          ls -la build
          ls -la build/web

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload Flet web artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: build/web

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
